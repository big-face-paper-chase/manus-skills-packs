name: Deploy interactive catalog

on:
  push:
    branches: [main]
    paths:
      - "browser/**"
      - "catalog/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: browser/pnpm-lock.yaml
      - name: Install browser dependencies
        run: pnpm --dir browser install --frozen-lockfile
      - name: Check browser types
        run: pnpm --dir browser check
      - name: Run browser tests
        run: pnpm --dir browser test
      - name: Build browser
        run: pnpm --dir browser build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: browser/dist

  deploy:
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
